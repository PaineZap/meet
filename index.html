<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaziMeet - Họp trực tuyến Gen Z</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Jitsi External API Script -->
    <script src="https://8x8.vc/external_api.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Floating Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <div class="hero-container">
            <header class="navbar">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fa-solid fa-bolt-lightning"></i>
                    </div>
                    <span class="logo-text">Lazi<span>Meet</span></span>
                </div>
                <div class="nav-badge">
                    <span class="pulse-dot"></span> Gen Z Powered by Jitsi
                </div>
            </header>

            <main class="hero-content">
                <div class="hero-text-side">
                    <h1 class="hero-title">Họp siêu vui, <br>kết nối <span class="gradient-text">cực đỉnh</span>!</h1>
                    <p class="hero-subtitle">Nền tảng họp trực tuyến miễn phí, giao diện Gen Z đầy màu sắc. Đảm bảo âm thanh, video mượt mà cho hàng chục người tham gia.</p>
                    <div class="hero-features">
                        <div class="feature-tag"><i class="fa-solid fa-shield-halved"></i> Ổn định tuyệt đối</div>
                        <div class="feature-tag"><i class="fa-solid fa-bolt"></i> Siêu tốc & Miễn phí</div>
                        <div class="feature-tag"><i class="fa-solid fa-wand-magic-sparkles"></i> Không cần backend</div>
                    </div>
                </div>

                <div class="hero-card glass-card">
                    <div class="card-tabs">
                        <button class="tab-btn active" data-tab="create">Tạo phòng mới</button>
                        <button class="tab-btn" data-tab="join">Tham gia phòng</button>
                    </div>

                    <!-- Create Room -->
                    <div id="create-tab" class="tab-content active">
                        <div class="form-group">
                            <label><i class="fa-solid fa-user"></i> Tên của bạn</label>
                            <input type="text" id="creator-name" placeholder="Ví dụ: Nam Phong GenZ" autocomplete="off">
                        </div>
                        <button id="btn-create-room" class="btn btn-primary">
                            <i class="fa-solid fa-video"></i> Tạo phòng ngay
                        </button>
                    </div>

                    <!-- Join Room -->
                    <div id="join-tab" class="tab-content">
                        <div class="form-group">
                            <label><i class="fa-solid fa-user"></i> Tên của bạn</label>
                            <input type="text" id="join-name" placeholder="Ví dụ: Thảo My" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-key"></i> Tên phòng hoặc Mã phòng</label>
                            <input type="text" id="room-code-input" placeholder="Nhập tên phòng..." autocomplete="off">
                        </div>
                        <button id="btn-join-room" class="btn btn-secondary">
                            <i class="fa-solid fa-right-to-bracket"></i> Vào phòng họp
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MEETING ROOM SCREEN -->
    <div id="meeting-screen" class="screen">
        <header class="meeting-header">
            <div class="meeting-brand">
                <div class="logo-icon-small">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <span class="meeting-title-logo">LaziMeet</span>
                <span class="divider">|</span>
                <span id="current-room-badge" class="room-badge">Phòng: Đang tải...</span>
            </div>
            <div class="meeting-top-actions">
                <button id="btn-copy-link" class="top-btn" title="Sao chép đường dẫn mời">
                    <i class="fa-solid fa-link"></i> <span>Copy Link</span>
                </button>
            </div>
        </header>

        <!-- Jitsi Embed Container (Nơi hiển thị video call chuẩn xịn) -->
        <div class="meeting-body">
            <div id="jitsi-container"></div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
